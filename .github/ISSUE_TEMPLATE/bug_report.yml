name: Bug report
description: Something Barn does is wrong, and you can show it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a suspected vulnerability here — follow
        [SECURITY.md](https://github.com/pgsty/barn/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        $ barn up
        error: ...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version and host
      description: Output of `barn --json version`.
      render: json
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: barn doctor
      description: Output of `barn doctor`. This usually identifies the cause on its own.
      render: shell
    validations:
      required: true
  - type: textarea
    id: inventory
    attributes:
      label: Inventory
      description: The smallest `barn.yml` that reproduces this. Remove anything sensitive.
      render: yaml
  - type: textarea
    id: verbose
    attributes:
      label: Verbose output
      description: Re-run the failing command with `--verbose` and paste the result.
      render: shell
