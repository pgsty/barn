name: Feature request
description: Propose a capability Barn does not have.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Barn is deliberately small and has ratified non-negotiables listed in
        [CONTRIBUTING.md](https://github.com/pgsty/barn/blob/main/CONTRIBUTING.md).
        A proposal that contradicts one of them will be declined regardless of
        implementation quality.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Barn makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: The current workaround, and why it is not good enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: What the command, flag, or inventory key would look like in use.
