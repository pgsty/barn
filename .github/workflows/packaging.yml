name: packaging

# The release workflow only ever runs on a tag, so without this job the entire
# packaging path — GoReleaser, nFPM, Syft, the archive and Linux-package
# verifiers — would first execute during a real release, with a pushed tag
# already in the way. This runs exactly that path on demand and on every change
# to the packaging surface, using the same pinned toolchain.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - ".goreleaser.yaml"
      - "packaging/**"
      - "native/**"
      - "internal/macvm/**"
      - "cmd/barn/*mac*.go"
      - "docs/mac*.md"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/packaging.yml"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - "packaging/**"
      - "native/**"
      - "internal/macvm/**"
      - "cmd/barn/*mac*.go"
      - "docs/mac*.md"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/packaging.yml"
      - ".github/workflows/mac.yml"

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/mac.yml
  snapshot:
    # The Mac payload is optional: a missing macOS 27 runner never blocks CI.
    needs: native
    if: ${{ !cancelled() }}
    name: GoReleaser snapshot and package verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: true

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true

      - name: Install pinned standalone nFPM and Syft
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm jq libarchive-tools ruby
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          install -d -m 0755 "${RUNNER_TEMP}/bin"
          curl -fsSLo "${RUNNER_TEMP}/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d \
            "${RUNNER_TEMP}/syft.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}/bin" syft
          printf '%s\n' "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      # The same inventory the release workflow checks, so a tool added to
      # make check can never be missing only when a tag is already pushed.
      - name: Verify the complete pinned toolchain
        run: ./packaging/check-toolchain.sh all

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.native.result == 'success'
        with:
          name: barn-mac-native
          path: ${{ runner.temp }}/barn-mac

      - name: Build and verify a full snapshot release
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/barn-mac/mac-native.tar.gz"
          if [[ -f $payload ]]; then
            BARN_MAC_PAYLOAD=$payload BARN_MAC_REQUIRE_PAYLOAD=1 make release-snapshot
          else
            echo "::warning::No native Mac payload; the snapshot is verified without it."
            make release-snapshot
          fi

      - name: Build and verify the development release path
        shell: bash
        run: |
          set -euo pipefail
          version="0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          source_epoch=$(git show -s --format=%ct HEAD)
          make release-dev VERSION="${version}" SOURCE_DATE_EPOCH="${source_epoch}"

      - name: Assemble and checksum the snapshot asset set
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.version' .goreleaser-snapshot/metadata.json)
          source_epoch=$(git show -s --format=%ct HEAD)
          ./packaging/assemble-release.sh "${version}" "$(git rev-parse --verify HEAD)" \
            "${source_epoch}" "${GITHUB_WORKSPACE}/.goreleaser-snapshot" \
            "${GITHUB_WORKSPACE}/.goreleaser-snapshot" "${GITHUB_WORKSPACE}/release-assets"
          # A snapshot is never 1.0.0, so the shared pre-1.0 rule must classify it
          # as a prerelease. This is the same check the release workflow runs.
          test "$(jq -r .channel release-assets/release.json)" = prerelease

      - name: Upload the snapshot asset set for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: barn-snapshot-assets
          path: release-assets/
          retention-days: 7
