name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/mac.yml
    with:
      version: ${{ github.ref_name }}
      notarize: true
    secrets: inherit
  release:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          source packaging/semver.sh
          [[ ${GITHUB_REF_TYPE} == tag && ${GITHUB_REF_NAME} == v* ]]
          farrow_is_semver "${GITHUB_REF_NAME#v}"
          git diff --quiet
          git diff --cached --quiet
          test "$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          printf 'FARROW_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >>"${GITHUB_ENV}"
          printf 'FARROW_COMMIT=%s\n' "${GITHUB_SHA}" >>"${GITHUB_ENV}"
          source_epoch=$(git show -s --format=%ct "${GITHUB_SHA}")
          printf 'SOURCE_DATE_EPOCH=%s\n' "${source_epoch}" >>"${GITHUB_ENV}"
          printf 'FARROW_BUILD_DATE=%s\n' "$(date -u -d "@${source_epoch}" +%Y-%m-%dT%H:%M:%SZ)" >>"${GITHUB_ENV}"

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: true

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true

      - name: Install pinned standalone nFPM and Syft
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm jq libarchive-tools ruby
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/tools/cmd/deadcode@v0.49.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          install -d -m 0755 "${RUNNER_TEMP}/bin"
          curl -fsSLo "${RUNNER_TEMP}/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3 \
            "${RUNNER_TEMP}/syft.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}/bin" syft
          printf '%s\n' "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Verify source and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/check-toolchain.sh all
          make check
          goreleaser check

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: farrow-mac-native
          path: ${{ runner.temp }}/farrow-mac

      - name: Build and verify GoReleaser release assets
        shell: bash
        env:
          FARROW_MAC_REQUIRE_PAYLOAD: "1"
          FARROW_MAC_REQUIRE_NOTARIZATION: "1"
        run: |
          set -euo pipefail
          trap './packaging/dependency-licenses.sh clean .goreleaser-licenses' EXIT
          goreleaser release --clean --skip=publish --parallelism 1
          python3 packaging/mac-release.py attach "$FARROW_VERSION" "$FARROW_COMMIT" "$SOURCE_DATE_EPOCH" "$GITHUB_WORKSPACE/.goreleaser-dist" "$RUNNER_TEMP/farrow-mac/mac-native.tar.gz"
          ./packaging/verify-goreleaser.sh "${FARROW_VERSION}" "${GITHUB_WORKSPACE}/.goreleaser-dist"
          ./packaging/verify-linux-packages.sh \
            "${FARROW_VERSION}" "${GITHUB_SHA}" "${SOURCE_DATE_EPOCH}" \
            "${GITHUB_WORKSPACE}/.goreleaser-dist"

      - name: Assemble final checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/assemble-release.sh "${FARROW_VERSION}" "${GITHUB_SHA}" \
            "${SOURCE_DATE_EPOCH}" "${GITHUB_WORKSPACE}/.goreleaser-dist" \
            "${GITHUB_WORKSPACE}/.goreleaser-dist" "${GITHUB_WORKSPACE}/release-assets"

      - name: Create immutable draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source packaging/semver.sh
          notes_file=".github/releases/${FARROW_VERSION}.md"
          test -f "${notes_file}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            printf 'release already exists; refusing to overwrite %s\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          # One rule decides pre-1.0, shared with the channel recorded in
          # release.json, so the Release page and the artifacts always agree.
          prerelease=()
          if ! farrow_is_stable_release "${FARROW_VERSION}"; then
            prerelease=(--prerelease)
            test "$(jq -r .channel release-assets/release.json)" = prerelease
          else
            test "$(jq -r .channel release-assets/release.json)" = stable
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag --draft "${prerelease[@]}" --title "Farrow ${FARROW_VERSION}" \
            --notes-file "${notes_file}"
