version: 2

project_name: barn

# Keep formal artifacts isolated from the historical dist/ tree. GoReleaser
# does not template this field; wrappers move the complete directory only after
# a successful snapshot when a different review name is requested.
dist: .goreleaser-dist

before:
  hooks:
    - ./packaging/dependency-licenses.sh stage .goreleaser-licenses

builds:
  - id: barn
    main: ./cmd/barn
    binary: bin/barn
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
      - -overlay=.goreleaser-companion/{{ .Os }}_{{ .Arch }}/overlay.json
    hooks:
      pre:
        - cmd: './packaging/goreleaser-companion.sh prepare "{{ .Os }}" "{{ .Arch }}" .goreleaser-companion'
          output: true
      post:
        - cmd: './packaging/goreleaser-companion.sh cleanup "{{ .Os }}" "{{ .Arch }}" .goreleaser-companion'
    ldflags:
      - >-
        -buildid= -s -w
        -X github.com/pgsty/barn/internal/version.Version={{.Version}}
        -X github.com/pgsty/barn/internal/version.Commit={{ .Env.BARN_COMMIT }}
        -X github.com/pgsty/barn/internal/version.Date={{ .Env.BARN_BUILD_DATE }}
    mod_timestamp: "{{ .Env.SOURCE_DATE_EPOCH }}"
  - id: barn-hosts-helper
    main: ./cmd/barn-hosts-helper
    binary: bin/barn-hosts-helper
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -buildid= -s -w
    mod_timestamp: "{{ .Env.SOURCE_DATE_EPOCH }}"
  - id: barn-package-linux-amd64
    main: ./cmd/barn
    binary: bin/barn
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos: [linux]
    goarch: [amd64]
    flags:
      - -trimpath
      - -buildvcs=false
      - -overlay=.goreleaser-companion/linux_amd64/overlay.json
    hooks:
      pre:
        - cmd: './packaging/goreleaser-companion.sh prepare linux amd64 .goreleaser-companion'
          output: true
      post:
        - cmd: './packaging/goreleaser-package-stage.sh linux amd64 "{{ .Path }}" "{{ .Version }}" "{{ .Env.BARN_COMMIT }}" "{{ .Env.BARN_BUILD_DATE }}" "{{ .Env.SOURCE_DATE_EPOCH }}" .goreleaser-companion'
          output: true
    ldflags:
      - >-
        -buildid= -s -w
        -X github.com/pgsty/barn/internal/version.Version={{.Version}}
        -X github.com/pgsty/barn/internal/version.Commit={{ .Env.BARN_COMMIT }}
        -X github.com/pgsty/barn/internal/version.Date={{ .Env.BARN_BUILD_DATE }}
    mod_timestamp: "{{ .Env.SOURCE_DATE_EPOCH }}"
  - id: barn-package-linux-arm64
    main: ./cmd/barn
    binary: bin/barn
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos: [linux]
    goarch: [arm64]
    flags:
      - -trimpath
      - -buildvcs=false
      - -overlay=.goreleaser-companion/linux_arm64/overlay.json
    hooks:
      pre:
        - cmd: './packaging/goreleaser-companion.sh prepare linux arm64 .goreleaser-companion'
          output: true
      post:
        - cmd: './packaging/goreleaser-package-stage.sh linux arm64 "{{ .Path }}" "{{ .Version }}" "{{ .Env.BARN_COMMIT }}" "{{ .Env.BARN_BUILD_DATE }}" "{{ .Env.SOURCE_DATE_EPOCH }}" .goreleaser-companion'
          output: true
    ldflags:
      - >-
        -buildid= -s -w
        -X github.com/pgsty/barn/internal/version.Version={{.Version}}
        -X github.com/pgsty/barn/internal/version.Commit={{ .Env.BARN_COMMIT }}
        -X github.com/pgsty/barn/internal/version.Date={{ .Env.BARN_BUILD_DATE }}
    mod_timestamp: "{{ .Env.SOURCE_DATE_EPOCH }}"

archives:
  - id: barn
    ids: [barn, barn-hosts-helper]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    wrap_in_directory: true
    builds_info:
      owner: root
      group: root
      mtime: "{{ .Env.BARN_BUILD_DATE }}"
    files:
      - src: LICENSE
        info: &archive_file_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.BARN_BUILD_DATE }}"
      - src: README.md
        info: *archive_file_info
      - src: .goreleaser-licenses/*
        dst: licenses
        info: *archive_file_info

nfpms:
  - id: barn-packages-amd64
    ids: [barn-package-linux-amd64]
    package_name: barn
    file_name_template: "barn_{{ .Version }}_linux_{{ .Arch }}"
    formats: [deb, rpm]
    bindir: /usr
    vendor: Pigsty
    homepage: https://github.com/pgsty/barn
    maintainer: Pigsty <repo@pigsty.cc>
    description: |-
      Native Go/QEMU runtime for Pigsty development virtual machines.
      Barn boots one Pigsty-compatible inventory as one fixed-IP deployment.
    license: Apache-2.0
    release: "1"
    section: utils
    priority: optional
    mtime: "{{ .Env.BARN_BUILD_DATE }}"
    contents: &linux_package_contents
      - src: .goreleaser-companion/linux_{{ .Arch }}/package-content/
        dst: /
        type: tree
        file_info:
          owner: root
          group: root
          mtime: "{{ .Env.BARN_BUILD_DATE }}"
    overrides:
      deb:
        dependencies: [qemu-system-x86, qemu-utils, ovmf, openssh-client, iproute2]
      rpm:
        dependencies: [qemu-kvm, qemu-img, edk2-ovmf, openssh-clients, iproute]
    rpm:
      summary: Native Go/QEMU runtime for Pigsty development VMs
    deb:
      fields:
        Bugs: https://github.com/pgsty/barn/issues
  - id: barn-packages-arm64
    ids: [barn-package-linux-arm64]
    package_name: barn
    file_name_template: "barn_{{ .Version }}_linux_{{ .Arch }}"
    formats: [deb, rpm]
    bindir: /usr
    vendor: Pigsty
    homepage: https://github.com/pgsty/barn
    maintainer: Pigsty <repo@pigsty.cc>
    description: |-
      Native Go/QEMU runtime for Pigsty development virtual machines.
      Barn boots one Pigsty-compatible inventory as one fixed-IP deployment.
    license: Apache-2.0
    release: "1"
    section: utils
    priority: optional
    mtime: "{{ .Env.BARN_BUILD_DATE }}"
    contents: *linux_package_contents
    overrides:
      deb:
        dependencies: [qemu-system-arm, qemu-utils, qemu-efi-aarch64, openssh-client, iproute2]
      rpm:
        dependencies: [qemu-kvm, qemu-img, edk2-aarch64, openssh-clients, iproute]
    rpm:
      summary: Native Go/QEMU runtime for Pigsty development VMs
    deb:
      fields:
        Bugs: https://github.com/pgsty/barn/issues

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive-spdx
    artifacts: archive
    cmd: ../packaging/goreleaser-sbom.sh
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args:
      - "${artifact}"
      - "${document}"
    env:
      - SOURCE_DATE_EPOCH={{ .Env.SOURCE_DATE_EPOCH }}
  - id: package-spdx
    artifacts: package
    ids: [barn-packages-amd64, barn-packages-arm64]
    cmd: ../packaging/goreleaser-package-sbom.sh
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args:
      - "${artifact}"
      - "${document}"
    env:
      - SOURCE_DATE_EPOCH={{ .Env.SOURCE_DATE_EPOCH }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  github:
    owner: pgsty
    name: barn
  draft: true
  prerelease: auto
