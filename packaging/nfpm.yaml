name: barn
arch: ${NFPM_ARCH}
platform: linux
version: ${BARN_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Pigsty <repo@pigsty.cc>
vendor: Pigsty
homepage: https://github.com/pgsty/barn
license: Apache-2.0
description: |-
  Native Go/QEMU runtime for Pigsty development virtual machines.
  Barn boots one Pigsty-compatible inventory as one fixed-IP deployment.

overrides:
  deb:
    depends:
      - ${BARN_DEB_QEMU}
      - qemu-utils
      - ${BARN_DEB_FIRMWARE}
      - openssh-client
      - iproute2
  rpm:
    depends:
      - qemu-kvm
      - qemu-img
      - ${BARN_RPM_FIRMWARE}
      - openssh-clients
      - iproute

contents:
  - dst: /opt/barn
    type: dir
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0755
  - dst: /opt/barn/libexec
    type: dir
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0755
  - dst: /usr/share/doc/barn
    type: dir
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0755
  - dst: /usr/share/doc/barn/licenses
    type: dir
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0755
  - src: ${BARN_PAYLOAD}/usr/bin/barn
    dst: /usr/bin/barn
    expand: true
    file_info:
      owner: root
      group: root
      mode: 0755
  - src: ${BARN_PAYLOAD}/opt/barn/libexec/barn-hosts-helper
    dst: /opt/barn/libexec/barn-hosts-helper
    expand: true
    file_info:
      owner: root
      group: root
      mode: 0755
  - src: ${BARN_PAYLOAD}/usr/share/doc/barn/BUILD_INFO.json
    dst: /usr/share/doc/barn/BUILD_INFO.json
    expand: true
    file_info:
      owner: root
      group: root
      mode: 0644
  - src: ${BARN_PAYLOAD}/usr/share/doc/barn/LICENSE
    expand: true
    dst: /usr/share/doc/barn/LICENSE
  - src: ${BARN_PAYLOAD}/usr/share/doc/barn/README.md
    expand: true
    dst: /usr/share/doc/barn/README.md
  - src: ${BARN_PAYLOAD}/usr/share/doc/barn/licenses/*
    expand: true
    dst: /usr/share/doc/barn/licenses/

rpm:
  summary: Native Go/QEMU runtime for Pigsty development VMs

deb:
  fields:
    Bugs: https://github.com/pgsty/barn/issues
